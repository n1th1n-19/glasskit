[package]
name = "glasskit-widgets"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
libc = "0.2"
ember-core = { git = "https://github.com/n1th1n-19/ember.git", tag = "v0.1.4" }
tokio = { version = "1", features = ["rt"] }
png = "0.17"
serde_json = "1"
zbus = "6.2"
zune-jpeg = "0.5"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["tokio", "wayland", "winit"]

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
