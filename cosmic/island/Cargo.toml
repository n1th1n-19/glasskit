[package]
name = "glasskit-island"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
ember-core = { git = "https://github.com/n1th1n-19/ember", tag = "v0.1.4" }
zbus = "6.2"
tokio = { version = "1.54.1", features = ["rt"] }
futures-util = "0.3"
png = "0.17"
serde_json = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["applet", "applet-token", "wgpu"]

[profile.release]
strip = true
lto = "thin"
